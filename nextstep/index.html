<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NextStep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@600&family=Hind:wght@400;500;600&display=swap">
<style>
/* Layout: ruled-notebook page. Hero = headline left + animated staircase right, exam ticker,
   syllabus explorer, three rising steps, margin-ruled feature list, then a dashboard view. */
:root{
  --bg:#E7F6F0; --paper:#F6FCF9; --ink:#0A3A3C; --muted:#3F6366; --line:#BFE3D6;
  --accent:#C2410C; --on-accent:#FFFFFF; --hi:#FFC53D; --on-hi:#0A3A3C;
  --mint:#0F9D6E; --on-mint:#04261F; --sky:#1F6FA8; --on-sky:#FFFFFF;
  --stroke:#0A3A3C; --mark:#FFC53D;
  --btn-bg:var(--ink); --btn-fg:var(--bg);
  --gut:clamp(16px,4vw,40px);
  --font-display:'Baloo 2','Noto Sans Devanagari',system-ui,sans-serif;
  --font-body:'Hind','Noto Sans Devanagari',system-ui,sans-serif;
  --font-hand:'Caveat','Baloo 2',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06201F; --paper:#0C2F2E; --ink:#E6F7F1; --muted:#9CC4BC; --line:#164544;
    --accent:#FF8A4C; --on-accent:#06201F; --hi:#FFC53D; --on-hi:#0A3A3C;
    --mint:#3DDC9F; --on-mint:#04261F; --sky:#5CB8F0; --on-sky:#06201F;
    --stroke:#5FA79D; --mark:#8A3A0C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06201F; --paper:#0C2F2E; --ink:#E6F7F1; --muted:#9CC4BC; --line:#164544;
  --accent:#FF8A4C; --on-accent:#06201F; --hi:#FFC53D; --on-hi:#0A3A3C;
  --mint:#3DDC9F; --on-mint:#04261F; --sky:#5CB8F0; --on-sky:#06201F;
  --stroke:#5FA79D; --mark:#8A3A0C; color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{
  font-family:var(--font-body);font-size:17px;line-height:1.6;color:var(--ink);
  background-color:var(--bg);
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--line) 33px 34px);
  padding-inline:var(--gut);
}
body.lock{overflow:hidden}
.wrap{max-width:1120px;margin-inline:auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:clamp(1.7rem,3.6vw,2.5rem);font-weight:800;line-height:1.2}
h3{font-size:1.2rem;font-weight:700;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
select,input,textarea{
  font:inherit;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--stroke);border-radius:10px;padding:.55rem .75rem;min-width:0;max-width:100%;
}
textarea{width:100%;resize:vertical;line-height:1.5}
::placeholder{color:var(--muted);opacity:.85}

/* header */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  margin-inline:calc(var(--gut) * -1);padding:10px var(--gut);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px);border-bottom:1.5px solid var(--line);
}
.logo{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--font-display);font-weight:800;font-size:1.45rem;line-height:1}
.logo b{background:var(--mark);padding:0 .18em;border-radius:4px;font-weight:800}
.logo svg{width:30px;height:30px;flex:none}
.navlinks{display:flex;gap:6px;margin-left:12px}
.navlinks a{text-decoration:none;font-family:var(--font-display);font-weight:600;padding:.3rem .7rem;border-radius:999px}
.navlinks a:hover{background:var(--line)}
.navright{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#navAuth{display:inline-flex;gap:8px}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:40px;padding:0 .7rem;
  background:var(--paper);border:1.5px solid var(--stroke);border-radius:999px;font-family:var(--font-display);font-weight:700;
}
.icon-btn svg{width:20px;height:20px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  font-family:var(--font-display);font-weight:700;font-size:1.05rem;line-height:1.2;
  padding:.7rem 1.35rem;border-radius:999px;border:2px solid var(--stroke);
  background:var(--paper);color:var(--ink);
  transition:transform .15s ease,box-shadow .15s ease;
}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:4px 4px 0 var(--stroke)}
.btn.primary:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--stroke)}
.btn.primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--stroke)}
.btn.ghost:hover{background:var(--line)}
.btn.dark{background:var(--btn-bg);color:var(--btn-fg)}
.btn.small{font-size:.92rem;padding:.4rem .9rem}
.btn.small.primary{box-shadow:3px 3px 0 var(--stroke)}

/* hero */
.hero{
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
  gap:clamp(24px,5vw,64px);align-items:center;padding-block:clamp(28px,6vw,72px);
}
.eyebrow{
  display:inline-block;font-family:var(--font-hand);font-size:1.5rem;line-height:1;color:var(--accent);
  transform:rotate(-2deg);margin-bottom:.4rem;
}
:root[data-theme="dark"] .eyebrow{color:var(--accent)}
.hero h1{font-size:clamp(2.2rem,5.6vw,4.1rem);font-weight:800;line-height:1.18}
mark{
  color:var(--ink);padding:0 .14em;border-radius:6px;
  background:linear-gradient(var(--mark),var(--mark)) no-repeat 0 50%/0% 100%;
  animation:hl 1.1s .5s cubic-bezier(.6,.1,.2,1) forwards;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
}
@keyframes hl{to{background-size:100% 100%}}
.lead{font-size:1.15rem;color:var(--muted);max-width:34em;margin-top:1.1rem}
.cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:1.6rem}
.pathline{display:flex;gap:8px;flex-wrap:wrap;margin-top:1.6rem}
.pathline span{
  font-family:var(--font-display);font-weight:600;font-size:.9rem;padding:.15rem .7rem;
  border:1.5px solid var(--stroke);border-radius:8px;background:var(--paper);
}
.hero-art{position:relative;width:100%;max-width:470px;margin-inline:auto}
.hero-art svg{display:block;width:100%;height:auto;position:relative;z-index:1}
.sym{
  position:absolute;z-index:0;font-family:var(--font-hand);font-size:1.7rem;color:var(--muted);
  animation:floaty 7s ease-in-out infinite;animation-delay:calc(var(--d) * -1s);pointer-events:none;
}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.stair{animation:stepUp .75s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i) * .13s)}
@keyframes stepUp{from{transform:translateY(46px);opacity:0}to{transform:none;opacity:1}}
.ball{animation:climb 9s ease-in-out 1.4s infinite backwards;transform:translate(371px,59px)}
@keyframes climb{
  0%,10%{transform:translate(51px,267px);opacity:1}
  18%,28%{transform:translate(131px,215px)}
  36%,46%{transform:translate(211px,163px)}
  54%,64%{transform:translate(291px,111px)}
  72%,88%{transform:translate(371px,59px);opacity:1}
  95%{transform:translate(371px,59px);opacity:0}
  100%{transform:translate(51px,267px);opacity:0}
}
.flag{transform-box:fill-box;transform-origin:left center;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:scaleX(1) skewY(0)}50%{transform:scaleX(.82) skewY(6deg)}}
.stair-t{font-family:var(--font-display);font-weight:700;font-size:13px;text-anchor:middle}
.hand-t{font-family:var(--font-hand);font-size:22px;fill:var(--ink)}

/* ticker */
.ticker{
  margin-inline:calc(var(--gut) * -1);overflow:hidden;background:var(--ink);color:var(--bg);
  border-block:2px solid var(--stroke);padding-block:.55rem;
}
.ticker-track{display:flex;width:max-content;animation:scrollx 46s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker span{font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;padding-inline:1.3rem;white-space:nowrap}
.ticker span::after{content:"/";margin-left:2.6rem;opacity:.45}
@keyframes scrollx{to{transform:translateX(-50%)}}

/* sections */
section.block{padding-block:clamp(40px,7vw,88px)}
.sec-head{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.8rem;max-width:40rem}
.sec-head p{color:var(--muted)}

/* explorer */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{
  font-family:var(--font-display);font-weight:700;padding:.4rem 1rem;background:transparent;
  border:2px solid var(--stroke);border-radius:999px;
}
.tab.on{background:var(--btn-bg);color:var(--btn-fg)}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{
  font-family:var(--font-display);font-weight:600;font-size:.95rem;padding:.25rem .8rem;
  background:var(--paper);border:1.5px solid var(--stroke);border-radius:8px;
  transition:transform .12s ease;
}
.pill:hover{transform:translateY(-2px)}
.pill.on{background:var(--hi);color:var(--on-hi);box-shadow:2px 2px 0 var(--stroke)}
.ex-head{font-family:var(--font-display);font-weight:700;font-size:1.15rem;margin:1.6rem 0 .9rem}
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.subj{background:var(--paper);border:1.5px solid var(--stroke);border-radius:14px;padding:1rem 1.1rem;min-width:0}
.subj h3{margin-bottom:.5rem}
.subj ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.subj li{font-size:.9rem;padding:.05rem .55rem;background:var(--bg);border-radius:6px;border:1px solid var(--line)}
.ex-foot{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:1.4rem}
.fine{font-size:.88rem;color:var(--muted)}

/* how it works: rising steps */
.rise{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end}
.rise li{
  border:2px solid var(--stroke);border-radius:14px 14px 4px 4px;padding:1.1rem 1.2rem;
  display:flex;flex-direction:column;gap:.4rem;transition:transform .2s ease;
}
.rise li:hover{transform:translateY(-6px)}
.rise li:nth-child(1){min-height:11rem;background:var(--paper)}
.rise li:nth-child(2){min-height:14rem;background:var(--hi);color:var(--on-hi)}
.rise li:nth-child(3){min-height:17rem;background:var(--accent);color:var(--on-accent)}
.rise .n{font-family:var(--font-display);font-weight:800;font-size:3rem;line-height:1}
.rise p{font-size:.98rem}
.rise li:nth-child(1) p{color:var(--muted)}

/* features notebook */
.notebook{list-style:none;margin:0;padding:0 0 0 clamp(18px,4vw,44px);border-left:3px solid var(--accent);max-width:46rem}
.notebook li{display:flex;gap:14px;align-items:baseline;padding-block:.55rem;border-bottom:1.5px solid var(--line)}
.notebook .tk{font-family:var(--font-hand);font-size:1.7rem;color:var(--accent);line-height:1;flex:none}
.notebook strong{font-family:var(--font-display);font-weight:700;margin-right:.5rem}
.notebook span.d{color:var(--muted)}

/* closing band */
.band{
  background:var(--btn-bg);color:var(--btn-fg);border-radius:18px;padding:clamp(24px,5vw,48px);
  display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:56px;
}
.band h2{max-width:22ch}
.band p{opacity:.85;margin-top:.4rem}
.foot{padding-block:24px 40px;border-top:1.5px solid var(--line);display:flex;gap:10px 24px;flex-wrap:wrap;justify-content:space-between;color:var(--muted);font-size:.92rem}

/* auth modal */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(4,28,28,.64);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal{position:relative;width:100%;max-width:440px;background:var(--paper);border:2px solid var(--stroke);border-radius:16px;box-shadow:8px 8px 0 var(--stroke);padding:1.4rem 1.4rem 1.2rem}
.modal .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--stroke);background:var(--bg);font-size:1.3rem;line-height:1}
.modal h2{font-size:1.6rem;margin:.9rem 0 .8rem}
.field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.8rem;font-weight:500;font-size:.95rem}
.field input,.field select{width:100%}
.err{min-height:1.4em;color:var(--accent);font-weight:600;font-size:.92rem;margin-bottom:.5rem}
.modal .btn.primary{width:100%}
.modal .fine{margin-top:.9rem}

/* dashboard */
.dash{padding-block:clamp(20px,4vw,40px) 40px}
.dhead{display:flex;gap:16px 28px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.dhead h1{font-size:clamp(1.9rem,4.4vw,2.9rem);font-weight:800;line-height:1.2}
.dhead p{color:var(--muted)}
.dctl{display:flex;gap:12px;flex-wrap:wrap}
.dctl label{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem;font-weight:600;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--paper);border:1.5px solid var(--stroke);border-radius:14px;padding:.9rem 1rem}
.stat .l{font-size:.78rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-weight:800;font-size:2.3rem;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .v small{font-size:1rem;font-weight:600;color:var(--muted);margin-left:.3rem}
.dgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--paper);border:1.5px solid var(--stroke);border-radius:14px;padding:1.1rem 1.2rem;min-width:0}
.card h2{font-size:1.35rem;margin-bottom:.8rem}
.card .sub{color:var(--muted);font-size:.92rem;margin:-.5rem 0 .8rem}
.card.lift{box-shadow:5px 5px 0 var(--stroke)}

details.sj{border-top:1.5px solid var(--line);padding-block:.5rem}
details.sj:first-of-type{border-top:0}
details.sj summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:.25rem .8rem;align-items:center;padding-block:.2rem}
details.sj summary::-webkit-details-marker{display:none}
.sj-n{font-family:var(--font-display);font-weight:700;font-size:1.1rem}
.sj-n::before{content:"▸";display:inline-block;margin-right:.5rem;transition:transform .2s ease;color:var(--accent)}
details[open] .sj-n::before{transform:rotate(90deg)}
.sj-c{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;font-size:.92rem}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.topics{display:flex;flex-wrap:wrap;gap:8px;padding-block:.7rem .4rem}
.topic{
  position:relative;display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .75rem;cursor:pointer;
  border:1.5px solid var(--stroke);border-radius:8px;background:var(--bg);font-size:.93rem;line-height:1.35;
  transition:background .15s ease,transform .12s ease;
}
.topic:hover{transform:translateY(-1px)}
.topic input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.topic:focus-within{outline:3px solid var(--sky);outline-offset:2px}
.topic.on{background:var(--mint);color:var(--on-mint)}
.topic.on::before{content:"✓";font-weight:700}
.overall{display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem;flex-wrap:wrap}
.overall .bar{flex:1 1 140px;grid-column:auto}
.overall span{font-weight:600;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}

.timer{display:flex;flex-direction:column;align-items:center;gap:.7rem}
.ring-wrap{position:relative;width:min(100%,210px)}
.ring{display:block;width:100%;height:auto}
.ring circle{fill:none;stroke-width:12}
.ring .rt{stroke:var(--line)}
.ring .rp{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:540.35;transition:stroke-dashoffset .3s linear,stroke .3s ease}
.timer.brk .rp{stroke:var(--mint)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c b{font-family:var(--font-display);font-weight:800;font-size:2.7rem;line-height:1;font-variant-numeric:tabular-nums}
.ring-c span{font-family:var(--font-hand);font-size:1.45rem;color:var(--muted);line-height:1.1}
.trow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.trow label{display:flex;gap:.5rem;align-items:center;font-size:.9rem;color:var(--muted);font-weight:600}
.logrow{display:flex;gap:10px;flex-wrap:wrap}
.logrow input{flex:1 1 100px;width:100px}
.chart svg{display:block;width:100%;height:auto}
.gl{stroke:var(--line);stroke-width:1}
.gt{fill:var(--muted);font:11px var(--font-body)}
.cb{fill:var(--sky);transform-box:fill-box;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 70ms)}
.cb.today{fill:var(--accent)}
@keyframes grow{from{transform:scaleY(0)}}
.tasks{list-style:none;margin:.8rem 0 0;padding:0;display:flex;flex-direction:column}
.tasks li{display:flex;align-items:center;gap:8px;padding-block:.35rem;border-bottom:1.5px solid var(--line)}
.tasks label{display:flex;gap:.6rem;align-items:center;flex:1;min-width:0;cursor:pointer}
.tasks label span{overflow-wrap:anywhere}
.tasks input[type=checkbox]{width:1.15rem;height:1.15rem;accent-color:var(--mint);flex:none}
.tasks li.done span{text-decoration:line-through;color:var(--muted)}
.tasks li.empty{color:var(--muted);border-bottom:0;font-size:.95rem}
.tasks .del{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--stroke);background:var(--bg);line-height:1;flex:none}
.saved{font-size:.85rem;color:var(--muted);min-height:1.3em;margin-top:.3rem}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;
  transform:translate(-50%,24px);opacity:0;pointer-events:none;
  background:var(--btn-bg);color:var(--btn-fg);font-family:var(--font-display);font-weight:600;
  padding:.6rem 1.2rem;border-radius:999px;max-width:calc(100vw - 32px);text-align:center;
  transition:opacity .25s ease,transform .25s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:960px){.dgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .navlinks{display:none}
  .rise{grid-template-columns:minmax(0,1fr);align-items:stretch}
  .rise li:nth-child(n){min-height:0}
}
@media (max-width:540px){.hide-sm{display:none}}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  mark{background-size:100% 100%}
  .ticker{overflow-x:auto}
}
</style>
</head>
<body>

<header class="top">
  <a class="logo" href="#top" data-go="home" aria-label="NextStep">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="21" width="8" height="9" rx="2" fill="var(--sky)" stroke="var(--stroke)" stroke-width="2"/><rect x="12" y="13" width="8" height="17" rx="2" fill="var(--accent)" stroke="var(--stroke)" stroke-width="2"/><rect x="22" y="4" width="8" height="26" rx="2" fill="var(--hi)" stroke="var(--stroke)" stroke-width="2"/></svg>
    <span>Next<b>Step</b></span>
  </a>
  <nav class="navlinks" aria-label="Main">
    <a href="#explore" data-go="explore" data-i="nav_explore"></a>
    <a href="#how" data-go="how" data-i="nav_how"></a>
    <a href="#features" data-go="features" data-i="nav_feat"></a>

}

async function hash(email,pw){
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('nextstep:'+email+':'+pw));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=5381;const s='nextstep:'+email+':'+pw;
    for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;
    return 'f'+h.toString(16);
  }
}

/* ---------- saving: Supabase when configured, this browser otherwise ---------- */
const fail=()=>toast(t('e_net'));
const done=r=>{if(r&&r.error)fail();};
const persist={
  profile(){if(!me)return;if(!cloud){save();return;}sb.from('profiles').update({track:me.profile.track,exam:me.profile.exam||null}).eq('id',me.uid).then(done,fail);},
  notes(){if(!me)return;if(!cloud){save();return;}sb.from('profiles').update({notes:me.notes}).eq('id',me.uid).then(done,fail);},
  done(key,on){
    if(!cloud){save();return;}
    const q=on?sb.from('progress').upsert({user_id:me.uid,topic_key:key}):sb.from('progress').delete().eq('user_id',me.uid).eq('topic_key',key);
    q.then(done,fail);
  },
  log(day){if(!cloud){save();return;}sb.from('study_log').upsert({user_id:me.uid,day:day,minutes:me.log[day]},{onConflict:'user_id,day'}).then(done,fail);},
  async taskAdd(text){
    if(!cloud){me.tasks.unshift({id:Date.now(),t:text,d:false});save();return;}
    try{
      const r=await sb.from('tasks').insert({user_id:me.uid,text:text}).select().single();
      if(r.error){fail();return;}
      me.tasks.unshift({id:r.data.id,t:r.data.text,d:r.data.done});
    }catch(e){fail();}
  },
  taskDone(k){if(!cloud){save();return;}sb.from('tasks').update({done:k.d}).eq('id',k.id).then(done,fail);},
  taskDel(id){if(!cloud){save();return;}sb.from('tasks').delete().eq('id',id).then(done,fail);}
};
async function enterCloud(user){
  const r=await Promise.all([
    sb.from('profiles').select('*').eq('id',user.id).maybeSingle(),
    sb.from('progress').select('topic_key').eq('user_id',user.id),
    sb.from('study_log').select('day,minutes').eq('user_id',user.id),
    sb.from('tasks').select('*').eq('user_id',user.id).order('created_at',{ascending:false})
  ]);
  if(r.some(x=>x.error))throw new Error('load');
  const meta=user.user_metadata||{},row=r[0].data||{};
  me={uid:user.id,profile:{name:row.name||meta.name||user.email.split('@')[0],email:user.email,track:row.track||meta.track||'c10',exam:row.exam||''},done:{},log:{},tasks:[],notes:row.notes||''};
  r[1].data.forEach(x=>{me.done[x.topic_key]=true;});
  r[2].data.forEach(x=>{me.log[x.day]=x.minutes;});
  me.tasks=r[3].data.map(x=>({id:x.id,t:x.text,d:x.done}));
}
async function cloudAuth(){
  const err=$('#authErr');err.textContent='';
  const email=$('#fEmail').value.trim().toLowerCase(),pass=$('#fPass').value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent=t('e_email');return;}
  try{
    if(authMode==='signup'){
      const name=$('#fName').value.trim();
      if(!name){err.textContent=t('e_name');return;}
      if(pass.length<6){err.textContent=t('e_pass');return;}
      const r=await sb.auth.signUp({email:email,password:pass,options:{data:{name:name,track:$('#fTrack').value}}});
      if(r.error){err.textContent=/registered|exists/i.test(r.error.message)?t('e_exists'):t('e_net');return;}
      if(r.data.user&&r.data.user.identities&&r.data.user.identities.length===0){err.textContent=t('e_exists');return;}
      if(!r.data.session){setMode('login');err.textContent=t('auth_confirm');$('#fPass').value='';return;}
      await enterCloud(r.data.session.user);
      closeAuth();showView('dash');toast(t('t_welcome',{n:name.split(' ')[0]}));
    }else{
      const r=await sb.auth.signInWithPassword({email:email,password:pass});
      if(r.error){err.textContent=/confirm/i.test(r.error.message)?t('auth_confirm'):t('e_bad');return;}
      await enterCloud(r.data.user);
      closeAuth();showView('dash');
    }
    $('#fPass').value='';
  }catch(e){err.textContent=t('e_net');}
}

  const cur=$('#fTrack').value;buildTrackSelect($('#fTrack'),cur||'c10');
  setMode(authMode);
  renderNav();renderExplorer();
  if(me){buildTrackSelect($('#dTrack'),me.profile.track);renderDash();}
  drawTimer();
}

/* ---------- navigation ---------- */
function renderNav(){
  $('#navAuth').innerHTML=me
    ?'<button class="btn small ghost" type="button" data-go="'+(view==='dash'?'home':'dash')+'">'+esc(t(view==='dash'?'nav_home':'nav_dash'))+'</button><button class="btn small ghost" type="button" data-act="logout">'+esc(t('logout'))+'</button>'
    :'<button class="btn small ghost" type="button" data-act="login">'+esc(t('login'))+'</button><button class="btn small primary hide-sm" type="button" data-act="signup">'+esc(t('signup'))+'</button>';
  $('#langLbl').textContent=lang==='en'?'हिन्दी':'EN';
}
function showView(v,anchor){
  if(v==='dash'&&!me)v='home';
  view=v;
  $('#home').hidden=v!=='home';
  $('#dash').hidden=v!=='dash';
  if(v==='dash'){fillDash();renderDash();}
  renderNav();
  if(anchor){requestAnimationFrame(()=>{const el=document.getElementById(anchor);if(el)el.scrollIntoView({behavior:'smooth'});});}
  else window.scrollTo({top:0});
}
function go(id){
  if(id==='home'){showView('home');return;}
  if(id==='dash'){showView('dash');return;}
  if(view!=='home')showView('home',id);
  else{const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth'});}
}

/* ---------- ticker ---------- */
function renderTicker(){
  const names=TRACKS.filter(x=>x.g==='comp').map(x=>x.s);
  const row=names.map(n=>'<span>'+esc(n)+'</span>').join('');
  $('#tickerTrack').innerHTML=row+row;
}

/* ---------- explorer ---------- */
function renderExplorer(){
  const groups=['school','comp','college'];
  $('#exTabs').innerHTML=groups.map(g=>'<button class="tab'+(g===exGroup?' on':'')+'" type="button" role="tab" aria-selected="'+(g===exGroup)+'" data-g="'+g+'">'+esc(t('g_'+g))+'</button>').join('');
  const list=TRACKS.filter(x=>x.g===exGroup);
  if(!list.some(x=>x.id===exTrack))exTrack=list[0].id;
  $('#exPills').innerHTML=list.map(x=>'<button class="pill'+(x.id===exTrack?' on':'')+'" type="button" aria-pressed="'+(x.id===exTrack)+'" data-tr="'+x.id+'">'+esc(tn(x))+'</button>').join('');
  const tr=byId(exTrack);
  const n=tr.sub.reduce((a,s)=>a+s.t.length,0);
  $('#exHead').textContent=tn(tr)+' · '+tr.sub.length+' '+t('ex_subjects')+' · '+n+' '+t('ex_topics');
  $('#exGrid').innerHTML=tr.sub.map(s=>'<article class="subj"><h3>'+esc(tn(s))+'</h3><ul>'+s.t.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></article>').join('');
}
function startTrack(id){
  if(me){me.profile.track=id;persist.profile();showView('dash');}
  else openAuth('signup',id);
}

/* ---------- auth ---------- */
let authMode='signup',authTrack=null,lastFocus=null;
function setMode(m){
  authMode=m;
  $('#tabSignup').setAttribute('aria-selected',String(m==='signup'));
  $('#tabSignup').classList.toggle('on',m==='signup');
  $('#tabLogin').setAttribute('aria-selected',String(m==='login'));
  $('#tabLogin').classList.toggle('on',m==='login');
  $('#rowName').hidden=m!=='signup';
  $('#rowTrack').hidden=m!=='signup';
  $('#authTitle').textContent=t(m==='signup'?'auth_t_signup':'auth_t_login');
  $('#authSubmit').textContent=t(m==='signup'?'btn_signup':'btn_login');
  $('#fPass').setAttribute('autocomplete',m==='signup'?'new-password':'current-password');
  $('#authErr').textContent='';
  if(authTrack)$('#fTrack').value=authTrack;
}
function openAuth(mode,track){
  if(track)authTrack=track;
  lastFocus=document.activeElement;
  setMode(mode);
  $('#auth').hidden=false;
  document.body.classList.add('lock');
  setTimeout(()=>{const f=$(mode==='signup'?'#fName':'#fEmail');if(f)f.focus();},30);
}
function closeAuth(){
  $('#auth').hidden=true;
  document.body.classList.remove('lock');
  $('#fPass').value='';
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}
$('#authForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(cloud){cloudAuth();return;}
  const err=$('#authErr');err.textContent='';
  const email=$('#fEmail').value.trim().toLowerCase(),pass=$('#fPass').value;
  const U=users();
  if(authMode==='signup'){
    const name=$('#fName').value.trim();
    if(!name){err.textContent=t('e_name');return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent=t('e_email');return;}
    if(pass.length<6){err.textContent=t('e_pass');return;}
    if(U[email]){err.textContent=t('e_exists');return;}
    const h=await hash(email,pass);
    me={profile:{name:name,email:email,track:$('#fTrack').value,exam:''},hash:h,done:{},log:{},tasks:[],notes:''};
    U[email]=me;store.set('ns_users',U);store.set('ns_session',email);
    closeAuth();showView('dash');toast(t('t_welcome',{n:name.split(' ')[0]}));
  }else{
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent=t('e_email');return;}
    const u=U[email];
    if(!u){err.textContent=t('e_bad');return;}
    const h=await hash(email,pass);
    if(u.hash!==h){err.textContent=t('e_bad');return;}
    me=u;store.set('ns_session',email);
    closeAuth();showView('dash');
  }
  $('#fPass').value='';
});
function logout(){
  resetTimer();T.mode='focus';T.remain=T.len*60;drawTimer();
  if(cloud)sb.auth.signOut();
  me=null;store.set('ns_session',null);showView('home');
}

/* ---------- dashboard ---------- */
const openSub=new Set(),seenTrack=new Set();
function fillDash(){
  buildTrackSelect($('#dTrack'),me.profile.track);
  $('#dExam').value=me.profile.exam||'';
  $('#notes').value=me.notes||'';
  $('#savedMsg').textContent='';
}
function daysLeft(str){
  if(!str)return null;
  const p=str.split('-').map(Number);if(p.length!==3||p.some(isNaN))return null;
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.round((new Date(p[0],p[1]-1,p[2])-today)/864e5);
}
function streak(){
  let n=0;const d=new Date();
  if(!(me.log[dkey(d)]>0))d.setDate(d.getDate()-1);
  while(me.log[dkey(d)]>0){n++;d.setDate(d.getDate()-1);}
  return n;
}
function weekDays(){
  const out=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);out.push({w:d.getDay(),m:me.log[dkey(d)]||0,today:i===0});}
  return out;
}
function trackTotals(){
  const tr=byId(me.profile.track);let done=0,total=0;
  tr.sub.forEach((s,si)=>s.t.forEach((_,ti)=>{total++;if(me.done[tr.id+':'+si+':'+ti])done++;}));
  return {done,total};
}
function renderStats(){
  const wk=weekDays().reduce((a,x)=>a+x.m,0);
  const tt=trackTotals();
  const pct=tt.total?Math.round(tt.done/tt.total*100):0;
  const dl=daysLeft(me.profile.exam);
  let dv;
  if(dl===null)dv='<span style="font-size:1.1rem">'+esc(t('exam_none'))+'</span>';
  else if(dl<0)dv='<span style="font-size:1.4rem">'+esc(t('exam_past'))+'</span>';
  else if(dl===0)dv='<span style="font-size:1.6rem">'+esc(t('exam_today'))+'</span>';
  else dv=dl+'<small>'+esc(t('u_days'))+'</small>';
  $('#stats').innerHTML=
    '<div class="stat"><div class="l">'+esc(t('s_streak'))+'</div><div class="v">'+streak()+'<small>'+esc(t('u_days'))+'</small></div></div>'+
    '<div class="stat"><div class="l">'+esc(t('s_week'))+'</div><div class="v">'+(wk/60).toFixed(1)+'<small>'+esc(t('u_hrs'))+'</small></div></div>'+
    '<div class="stat"><div class="l">'+esc(t('s_syll'))+'</div><div class="v">'+pct+'<small>%</small></div></div>'+
    '<div class="stat"><div class="l">'+esc(t('s_days'))+'</div><div class="v">'+dv+'</div></div>';
}
function renderTracker(focusKey){
  const tr=byId(me.profile.track);
  if(!seenTrack.has(tr.id)){seenTrack.add(tr.id);openSub.add(tr.id+':0');}
  $('#trackList').innerHTML=tr.sub.map((s,si)=>{
    let d=0;s.t.forEach((_,ti)=>{if(me.done[tr.id+':'+si+':'+ti])d++;});
    const k=tr.id+':'+si,pct=Math.round(d/s.t.length*100);
    return '<details class="sj" data-k="'+k+'"'+(openSub.has(k)?' open':'')+'><summary><span class="sj-n">'+esc(tn(s))+'</span><span class="sj-c">'+d+'/'+s.t.length+'</span><span class="bar"><i style="width:'+pct+'%"></i></span></summary><div class="topics">'+
      s.t.map((x,ti)=>{const key=k+':'+ti,on=!!me.done[key];return '<label class="topic'+(on?' on':'')+'"><input type="checkbox" data-t="'+key+'"'+(on?' checked':'')+'><span>'+esc(x)+'</span></label>';}).join('')+
      '</div></details>';
  }).join('');
  const tt=trackTotals(),pct=tt.total?Math.round(tt.done/tt.total*100):0;
  $('#overallBar').style.width=pct+'%';
  $('#overallTxt').textContent=t('tr_of',{a:tt.done,b:tt.total});
  if(focusKey){const el=$('[data-t="'+focusKey+'"]');if(el)el.focus();}
}
function renderTasks(){
  $('#taskList').innerHTML=me.tasks.length
    ?me.tasks.map(k=>'<li class="'+(k.d?'done':'')+'"><label><input type="checkbox" data-id="'+k.id+'"'+(k.d?' checked':'')+'><span>'+esc(k.t)+'</span></label><button class="del" type="button" data-del="'+k.id+'" aria-label="'+esc(t('tk_del'))+'">×</button></li>').join('')
    :'<li class="empty">'+esc(t('tk_empty'))+'</li>';
}
function fmtMin(m){return m>=60?(Math.round(m/6)/10)+'h':m+'m';}
function renderChart(){
  const days=weekDays();
  const max=Math.max(60,Math.ceil(Math.max.apply(null,days.map(x=>x.m))/30)*30);
  const W=320,H=176,Lf=36,R=8,Tp=16,B=26,ph=H-Tp-B,bw=26,gap=(W-Lf-R-7*bw)/6;
  const y=v=>Tp+ph*(1-v/max);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t('wk_title')+': '+days.map(x=>fmtMin(x.m)).join(', '))+'">';
  [0,max/2,max].forEach(v=>{
    s+='<line class="gl" x1="'+Lf+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="gt" x="'+(Lf-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fmtMin(v)+'</text>';
  });
  days.forEach((d,i)=>{
    const x=Lf+i*(bw+gap),h=ph*d.m/max;
    if(d.m>0)s+='<rect class="cb'+(d.today?' today':'')+'" style="--i:'+i+'" x="'+x+'" y="'+(y(d.m))+'" width="'+bw+'" height="'+h+'" rx="4"><title>'+fmtMin(d.m)+'</title></rect><text class="gt" x="'+(x+bw/2)+'" y="'+(y(d.m)-4)+'" text-anchor="middle">'+fmtMin(d.m)+'</text>';
    s+='<text class="gt" x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle"'+(d.today?' style="font-weight:700"':'')+'>'+esc(t('wd')[d.w])+'</text>';
  });
  $('#chart').innerHTML=s+'</svg>';
}
function renderDash(){
  if(!me)return;
  $('#dHello').textContent=t('hello',{n:me.profile.name.split(' ')[0]});
  renderStats();renderTracker();renderTasks();renderChart();
}
function addMinutes(m){
  if(!me)return;
  const k=dkey(new Date());me.log[k]=(me.log[k]||0)+m;persist.log(k);
  renderStats();renderChart();
}

/* ---------- focus timer ---------- */
const T={mode:'focus',len:25,remain:25*60,running:false,end:0,iv:null};
const CIRC=540.35;
function totalSecs(){return (T.mode==='focus'?T.len:5)*60;}
function drawTimer(){
  const m=Math.floor(T.remain/60),s=T.remain%60;
  $('#tmTime').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  $('#ringP').setAttribute('stroke-dashoffset',String(CIRC*(T.remain/totalSecs())));
  $('#timerCard').classList.toggle('brk',T.mode==='break');
  $('#tmMode').textContent=t(T.mode==='focus'?'tm_focus':'tm_break');
  $('#tmGo').textContent=t(T.running?'tm_pause':'tm_start');
  $('#tmLen').disabled=T.running;
}
function tick(){
  T.remain=Math.max(0,Math.round((T.end-Date.now())/1000));
  drawTimer();
  if(T.remain<=0)finishTimer();
}
function startPause(){
  if(T.running){T.running=false;clearInterval(T.iv);}
  else{T.running=true;T.end=Date.now()+T.remain*1000;T.iv=setInterval(tick,250);}
  drawTimer();
}
function finishTimer(){
  clearInterval(T.iv);T.running=false;
  if(T.mode==='focus'){addMinutes(T.len);toast(t('t_done',{m:T.len}));T.mode='break';T.remain=5*60;}
  else{toast(t('t_break'));T.mode='focus';T.remain=T.len*60;}
  drawTimer();
}
function resetTimer(){clearInterval(T.iv);T.running=false;T.remain=totalSecs();drawTimer();}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const goEl=e.target.closest('[data-go]');
  if(goEl){e.preventDefault();go(goEl.dataset.go);return;}
  const act=e.target.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='signup')openAuth('signup');
    else if(a==='login')openAuth('login');
    else if(a==='logout')logout();
    return;
  }
  const g=e.target.closest('[data-g]');
  if(g){exGroup=g.dataset.g;renderExplorer();return;}
  const tr=e.target.closest('[data-tr]');
  if(tr){exTrack=tr.dataset.tr;renderExplorer();return;}
  const del=e.target.closest('[data-del]');
  if(del&&me){me.tasks=me.tasks.filter(k=>String(k.id)!==del.dataset.del);persist.taskDel(del.dataset.del);renderTasks();return;}
  const md=e.target.closest('[data-mode]');
  if(md){setMode(md.dataset.mode);return;}
});
$('#exCta').addEventListener('click',()=>startTrack(exTrack));
$('#authClose').addEventListener('click',closeAuth);
$('#auth').addEventListener('click',e=>{if(e.target.id==='auth')closeAuth();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#auth').hidden)closeAuth();});
$('#langBtn').addEventListener('click',()=>{lang=lang==='en'?'hi':'en';store.set('ns_lang',lang);applyLang();});
function effDark(){
  const d=document.documentElement.dataset.theme;
  if(d)return d==='dark';
  return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
}
$('#themeBtn').addEventListener('click',()=>{const nx=effDark()?'light':'dark';document.documentElement.dataset.theme=nx;store.set('ns_theme',nx);});

$('#dTrack').addEventListener('change',e=>{me.profile.track=e.target.value;persist.profile();renderDash();});
$('#dExam').addEventListener('change',e=>{me.profile.exam=e.target.value;persist.profile();renderStats();});
$('#trackList').addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.t;
  if(!k||!me)return;
  if(e.target.checked)me.done[k]=true;else delete me.done[k];
  persist.done(k,e.target.checked);renderTracker(k);renderStats();
});
$('#trackList').addEventListener('toggle',e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  if(e.target.open)openSub.add(k);else openSub.delete(k);
},true);
$('#taskForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const v=$('#taskIn').value.trim();if(!v||!me)return;
  $('#taskIn').value='';await persist.taskAdd(v);renderTasks();
});
$('#taskList').addEventListener('change',e=>{
  const id=e.target.dataset&&e.target.dataset.id;if(!id||!me)return;
  const k=me.tasks.find(x=>String(x.id)===id);if(k){k.d=e.target.checked;persist.taskDone(k);renderTasks();}
});
$('#logForm').addEventListener('submit',e=>{
  e.preventDefault();
  const v=parseInt($('#logMin').value,10);
  if(!v||v<1||v>600||!me)return;
  addMinutes(v);toast(t('t_logged',{m:v}));$('#logMin').value='';
});
let noteT;
$('#notes').addEventListener('input',e=>{
  clearTimeout(noteT);
  noteT=setTimeout(()=>{if(!me)return;me.notes=e.target.value;persist.notes();$('#savedMsg').textContent=t('nt_saved');},450);
});
$('#tmGo').addEventListener('click',startPause);
$('#tmReset').addEventListener('click',resetTimer);
$('#tmLen').addEventListener('change',e=>{
  T.len=parseInt(e.target.value,10)||25;
  if(!T.running&&T.mode==='focus'){T.remain=T.len*60;drawTimer();}
});

/* ---------- start ---------- */
const th=store.get('ns_theme',null);
if(th==='dark'||th==='light')document.documentElement.dataset.theme=th;
renderTicker();
const sess=cloud?null:store.get('ns_session',null);
if(sess){const u=users()[sess];if(u)me=u;}
applyLang();
if(me)showView('dash');
if(cloud){
  sb.auth.getSession().then(async r=>{
    const s=r.data&&r.data.session;
    if(s){try{await enterCloud(s.user);showView('dash');}catch(e){fail();}}
  });
}
})();
</script>

</body>
